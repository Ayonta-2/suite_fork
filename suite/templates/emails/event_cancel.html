<div style="font-family: Arial, sans-serif; max-width: 520px; margin: 0 auto; padding: 24px; color: #111827;">
	<h2 style="margin: 0 0 4px; font-size: 20px;">{{ title }}</h2>
	<p style="font-size: 14px; color: #6b7280; margin: 0 0 8px;">This event has been cancelled.</p>

	<table role="presentation" cellpadding="0" cellspacing="0" style="margin: 16px 0; font-size: 14px; color: #374151;">
		<tr><td style="padding: 4px 12px 4px 0; color: #6b7280;">When</td><td style="padding: 4px 0;">{{ when }}</td></tr>
		{% if location %}<tr><td style="padding: 4px 12px 4px 0; color: #6b7280;">Where</td><td style="padding: 4px 0;">{{ location }}</td></tr>{% endif %}
		<tr><td style="padding: 4px 12px 4px 0; color: #6b7280;">Organizer</td><td style="padding: 4px 0;">{{ organizer_name }}</td></tr>
	</table>

	{% if description %}<p style="font-size: 14px; color: #4b5563; line-height: 1.5;">{{ description }}</p>{% endif %}
</div>
