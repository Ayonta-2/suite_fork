services:
  stalwart:
    image: stalwartlabs/stalwart:${STALWART_VERSION:-v0.16.8}
    container_name: stalwart-test
    ports:
      - "${STALWART_HTTP_PORT:-8080}:8080"
    environment:
      STALWART_HOSTNAME: mail.example.test
      STALWART_RECOVERY_ADMIN: ${STALWART_ADMIN_USER:-admin}:${STALWART_ADMIN_PASSWORD:-admin}
    volumes:
      - stalwart-data:/etc/stalwart

volumes:
  stalwart-data:
