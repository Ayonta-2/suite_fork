<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex" />
	<title>{{ title }}</title>
	<style>
		:root {
			color-scheme: light;
			/* Frappe UI light-mode tokens */
			--bg: #f8f8f8;         /* gray-50 */
			--surface: #ffffff;    /* white */
			--border: #ededed;     /* gray-200 */
			--hairline: #f3f3f3;   /* gray-100 */
			--ink: #171717;        /* ink-gray-9 */
			--muted: #7c7c7c;      /* ink-gray-6 */
			--faint: #999999;      /* ink-gray-5 */
			--success-bg: #e4faeb; /* green-100 */
			--success-fg: #268c5c; /* green-600 */
			--error-bg: #ffe7e7;   /* red-100 */
			--error-fg: #ce2c2c;   /* red-600 */
		}
		* { box-sizing: border-box; }
		html, body { height: 100%; }
		body {
			margin: 0; display: flex; align-items: center; justify-content: center;
			font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			-webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
			background: var(--bg); color: var(--ink); padding: 24px;
		}
		.shell {
			display: flex; flex-direction: column; align-items: center; gap: 24px;
			width: 100%; max-width: 416px;
		}
		.logo { height: 44px; width: auto; }
		.card {
			background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
			box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 6px 20px rgba(0, 0, 0, 0.05);
			padding: 44px 40px; width: 100%; text-align: center;
		}
		.badge {
			width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 22px;
			display: flex; align-items: center; justify-content: center;
		}
		.badge svg { width: 30px; height: 30px; fill: none; stroke-width: 2.4;
			stroke-linecap: round; stroke-linejoin: round; }
		.badge.success { background: var(--success-bg); }
		.badge.success svg { stroke: var(--success-fg); }
		.badge.error { background: var(--error-bg); }
		.badge.error svg { stroke: var(--error-fg); }
		h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 8px; text-wrap: balance; }
		p { font-size: 14.5px; line-height: 1.55; color: var(--muted); margin: 0 auto; max-width: 32ch; }
		.countdown {
			margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--hairline);
			font-size: 12.5px; color: var(--faint);
		}
	</style>
</head>
<body>
	<div class="shell">
	<img class="logo" src="{{ logo_url }}" alt="Frappe Calendar" />
	<main class="card">
		{% if success %}
		<div class="badge success">
			<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
		</div>
		{% else %}
		<div class="badge error">
			<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
		</div>
		{% endif %}
		<h1>{{ title }}</h1>
		<p>{{ message }}</p>
		{% if success and auto_close_seconds %}<div class="countdown" id="countdown"></div>{% endif %}
	</main>
	</div>

	{% if success and auto_close_seconds %}
	<script>
		(function () {
			var s = {{ auto_close_seconds }};
			var el = document.getElementById("countdown");
			function tick() {
				if (s <= 0) {
					window.close();
					if (el) { el.textContent = "You can close this tab now."; }
					return;
				}
				if (el) { el.textContent = "This tab will close in " + s + " second" + (s === 1 ? "" : "s") + "…"; }
				s -= 1;
				setTimeout(tick, 1000);
			}
			tick();
		})();
	</script>
	{% endif %}
</body>
</html>
